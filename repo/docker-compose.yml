services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citybus}
      POSTGRES_USER: ${POSTGRES_USER:-citybus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citybus}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citybus} -d ${POSTGRES_DB:-citybus}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-citybus}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-citybus}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-citybus}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-01234567890123456789012345678901}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-01234567890123456789012345678902}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123!}
      BOOTSTRAP_DISPATCHER_PASSWORD: ${BOOTSTRAP_DISPATCHER_PASSWORD:-Dispatch123!}
      BOOTSTRAP_PASSENGER_PASSWORD: ${BOOTSTRAP_PASSENGER_PASSWORD:-Passenger123!}
      BOOTSTRAP_ADMIN_RECOVERY_CODE: ${BOOTSTRAP_ADMIN_RECOVERY_CODE:-ADMIN-RECOVERY-1}
      BOOTSTRAP_DISPATCHER_RECOVERY_CODE: ${BOOTSTRAP_DISPATCHER_RECOVERY_CODE:-DISPATCHER-RECOVERY-1}
      BOOTSTRAP_PASSENGER_RECOVERY_CODE: ${BOOTSTRAP_PASSENGER_RECOVERY_CODE:-PASSENGER-RECOVERY-1}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"

  postgres-backup:
    build:
      context: ./ops/backup
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-citybus}
      POSTGRES_USER: ${POSTGRES_USER:-citybus}
      PGPASSWORD: ${POSTGRES_PASSWORD:-citybus}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_backups:/backup

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: builder
    environment:
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-01234567890123456789012345678901}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-01234567890123456789012345678902}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-Admin123!}
      BOOTSTRAP_DISPATCHER_PASSWORD: ${BOOTSTRAP_DISPATCHER_PASSWORD:-Dispatch123!}
      BOOTSTRAP_PASSENGER_PASSWORD: ${BOOTSTRAP_PASSENGER_PASSWORD:-Passenger123!}
      BOOTSTRAP_ADMIN_RECOVERY_CODE: ${BOOTSTRAP_ADMIN_RECOVERY_CODE:-ADMIN-RECOVERY-1}
      BOOTSTRAP_DISPATCHER_RECOVERY_CODE: ${BOOTSTRAP_DISPATCHER_RECOVERY_CODE:-DISPATCHER-RECOVERY-1}
      BOOTSTRAP_PASSENGER_RECOVERY_CODE: ${BOOTSTRAP_PASSENGER_RECOVERY_CODE:-PASSENGER-RECOVERY-1}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    command: ["mvn", "test"]

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test
    command: ["npm", "run", "test:ci"]

  e2e:
    profiles: ["test"]
    build:
      context: ./frontend
      target: e2e
    depends_on:
      frontend:
        condition: service_started
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend
    command: ["npx", "playwright", "test"]

volumes:
  postgres_data:
  postgres_backups:
